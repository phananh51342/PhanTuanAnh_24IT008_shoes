<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>PhanhShoes - Admin Login</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;

      font-family: Arial, sans-serif;

      background:
        linear-gradient(
          135deg,
          #0f172a,
          #1e3a8a
        );
    }

    .login-card {
      width: 90%;
      max-width: 420px;

      background: white;

      padding: 35px;

      border-radius: 20px;

      box-shadow:
        0 25px 60px rgba(0,0,0,.25);
    }

    .logo {
      width: 60px;
      height: 60px;

      display: grid;
      place-items: center;

      margin-bottom: 20px;

      border-radius: 16px;

      background: #1e3a8a;

      font-size: 30px;
    }

    h1 {
      margin: 0 0 8px;

      color: #172033;
    }

    .subtitle {
      margin: 0 0 25px;

      color: #64748b;
      line-height: 1.6;
    }

    label {
      display: block;

      margin-bottom: 7px;

      font-weight: bold;

      color: #334155;
    }

    input {
      width: 100%;

      padding: 13px 14px;

      margin-bottom: 18px;

      border: 1px solid #dbe2ea;

      border-radius: 10px;

      font-size: 15px;

      outline: none;
    }

    input:focus {
      border-color: #2563eb;
    }

    button {
      width: 100%;

      padding: 14px;

      border: none;

      border-radius: 10px;

      background: #2563eb;
      color: white;

      font-weight: bold;

      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:disabled {
      opacity: .6;
    }

    #message {
      min-height: 20px;

      margin-top: 15px;

      text-align: center;

      color: #dc2626;
    }
  </style>
</head>

<body>

  <div class="login-card">

    <div class="logo">
      👟
    </div>

    <h1>
      PhanhShoes Admin
    </h1>

    <p class="subtitle">
      Đăng nhập để truy cập trang quản lý.
    </p>


    <form id="login-form">

      <label>
        Tài khoản
      </label>

      <input
        id="username"
        type="text"
        placeholder="Nhập tài khoản"
        required
      >


      <label>
        Mật khẩu
      </label>

      <input
        id="password"
        type="password"
        placeholder="Nhập mật khẩu"
        required
      >


      <button
        id="login-button"
        type="submit"
      >
        Đăng nhập
      </button>


      <p id="message"></p>

    </form>

  </div>


  <script>

    const form =
      document.getElementById("login-form");

    const message =
      document.getElementById("message");

    const button =
      document.getElementById("login-button");


    form.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();

        message.textContent = "";

        button.disabled = true;

        button.textContent =
          "Đang đăng nhập...";


        try {

          const response =
            await fetch(
              "/api/auth/login",
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body: JSON.stringify({

                  username:
                    document
                      .getElementById(
                        "username"
                      )
                      .value,

                  password:
                    document
                      .getElementById(
                        "password"
                      )
                      .value

                })
              }
            );


          const result =
            await response.json();


          if (!response.ok) {

            throw new Error(
              result.error ||
              "Đăng nhập thất bại."
            );

          }


          location.href =
            "/index.html";


        } catch (error) {

          message.textContent =
            error.message;

        } finally {

          button.disabled = false;

          button.textContent =
            "Đăng nhập";

        }

      }
    );

  </script>

</body>
</html>
