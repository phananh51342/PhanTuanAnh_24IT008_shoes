<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Shop Giày — Sản phẩm</title><link rel="stylesheet" href="/style.css"></head>
<body><div class="app-shell"><aside class="sidebar"><div class="brand"><div class="brand-mark">👟</div><div><strong>Shop Giày</strong><span>Email Campaign</span></div></div><nav class="nav"><a href="index.html"><span class="icon">⌂</span>Tổng quan</a><a href="campaigns.html"><span class="icon">◫</span>Chiến dịch</a><a href="email.html"><span class="icon">✉</span>Soạn & gửi</a><a href="tracking.html"><span class="icon">◎</span>Theo dõi</a><a href="products.html"><span class="icon">◆</span>Sản phẩm</a><a href="customers.html"><span class="icon">♙</span>Khách hàng</a></nav></aside>
<main class="main"><header class="page-head"><div><h1>Sản phẩm</h1><p>Thêm mẫu giày mới và xem danh sách sản phẩm đang có.</p></div></header>
<section class="card"><div class="card-head"><h2>Thêm mẫu giày</h2></div><div class="card-body"><form id="product-form" class="form-grid"><input id="product-id" type="hidden"><div class="form-group"><label>Tên mẫu giày</label><input id="product-name" required></div><div class="form-group"><label>Loại giày</label><select id="product-category" required><option value="basketball">Giày bóng rổ</option><option value="running">Giày chạy bộ</option><option value="sneaker">Sneaker</option><option value="general">Khác</option></select></div><div class="form-group"><label>Giá</label><input id="product-price" type="number" min="0" required></div><div class="form-group"><label>Giá khuyến mãi</label><input id="product-sale-price" type="number" min="0"></div><div class="form-group"><label>URL ảnh</label><input id="product-image-url" type="url"></div><div class="form-group"><label>URL sản phẩm</label><input id="product-url" type="url"></div><div class="form-group full"><label>Mô tả</label><textarea id="product-description"></textarea></div><div class="form-group full"><div class="actions"><button class="btn btn-primary" id="product-save" type="submit">Thêm mẫu giày</button><button class="btn btn-ghost" id="product-cancel" type="button" hidden>Hủy sửa</button></div><p id="product-form-message" class="message"></p></div></form></div></section>
<section style="margin-top:22px"><div class="page-head" style="margin-bottom:14px"><div><h1 style="font-size:22px">Danh sách sản phẩm</h1><p id="product-status"></p></div></div><div id="products" class="product-grid"></div></section>
</main></div><script src="/common.js"></script><script src="/products.js"></script></body></html>
