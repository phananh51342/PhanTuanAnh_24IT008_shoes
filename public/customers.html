<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Shop Giày — Khách hàng</title><link rel="stylesheet" href="/style.css"></head>
<body><div class="app-shell"><aside class="sidebar"><div class="brand"><div class="brand-mark">👟</div><div><strong>Shop Giày</strong><span>Email Campaign</span></div></div><nav class="nav"><a href="index.html"><span class="icon">⌂</span>Tổng quan</a><a href="campaigns.html"><span class="icon">◫</span>Chiến dịch</a><a href="email.html"><span class="icon">✉</span>Soạn & gửi</a><a href="tracking.html"><span class="icon">◎</span>Theo dõi</a><a href="products.html"><span class="icon">◆</span>Sản phẩm</a><a href="customers.html"><span class="icon">♙</span>Khách hàng</a></nav></aside>
<main class="main"><header class="page-head"><div><h1>Khách hàng</h1><p>Thêm khách mới, chỉnh sửa email, nhóm quan tâm và trạng thái nhận quảng cáo.</p></div></header>
<section class="card"><div class="card-head"><h2 id="customer-form-title">Thêm / sửa khách hàng</h2></div><div class="card-body"><form id="customer-form" class="form-grid"><input type="hidden" id="customer-id"><div class="form-group"><label>Họ tên</label><input id="customer-name" maxlength="100" required></div><div class="form-group"><label>Email</label><input id="customer-email" type="email" maxlength="254" required></div><div class="form-group"><label>Nhóm quan tâm</label><select id="customer-group"><option value="basketball">Giày bóng rổ</option><option value="running">Giày chạy bộ</option><option value="sneaker">Sneaker</option><option value="general">Nhóm chung</option></select></div><div class="form-group"><label>Nhận quảng cáo</label><label class="checkbox-row"><input id="customer-subscribed" type="checkbox" checked> Đồng ý nhận email quảng cáo</label></div><div class="form-group full"><div class="actions"><button id="customer-save" class="btn btn-primary" type="submit">Thêm khách hàng</button><button id="customer-cancel" class="btn btn-ghost" type="button" hidden>Hủy sửa</button></div><p id="customer-form-message" class="message"></p></div></form></div></section>
<section class="card" style="margin-top:20px"><div class="card-head"><h2>Danh sách khách hàng</h2><input id="customer-search" style="max-width:320px" placeholder="Tìm tên hoặc email..."></div><div class="card-body"><div class="table-wrap"><table><thead><tr><th>Họ tên</th><th>Email</th><th>Nhóm quan tâm</th><th>Nhận quảng cáo</th><th>Thao tác</th></tr></thead><tbody id="customers"></tbody></table></div><p id="customer-status" class="message"></p></div></section>
</main></div><script src="/common.js"></script><script src="/customers.js"></script></body></html>
